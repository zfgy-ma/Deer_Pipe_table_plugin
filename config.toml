# ═══════════════════════════════════════════════════════════════════════
#  鹿管记录与月度统计插件 — 运行时配置
#  v1.4.0
# ═══════════════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════════════
#  插件设置
# ═══════════════════════════════════════════════════════════════════════

[plugin]
config_version = "1.4.0"
# 是否启用插件（关闭后完全不工作）
enabled = true

# ═══════════════════════════════════════════════════════════════════════
#  触发词与功能开关
# ═══════════════════════════════════════════════════════════════════════

[trigger]
# 启用鹿管记录功能（发送触发词时记录一次）
enable_record = true
# 鹿管记录触发词（消息完全等于该词时记录）默认：🦌
deer_pipe_record_words = "🦌"
# 启用排行榜查询功能
enable_rank = true
# 排行榜查询触发词 默认：🦌排名
deer_pipe_rank_words = "🦌排名"
# 启用个人统计查询功能
enable_personal = true
# 个人统计查询触发词 默认：我的🦌
deer_pipe_personal_words = "我的🦌"
# 启用月度图表查询功能
enable_monthly = true
# 月表命令基础词（支持 上月X/本月X/X N月 三种格式）默认：🦌表
deer_pipe_monthly_words = "🦌表"

# ═══════════════════════════════════════════════════════════════════════
#  夜间模式
# ═══════════════════════════════════════════════════════════════════════

[dark_mode]
# 开启夜间模式（指定时段内图表自动切换暗色主题）
dark_mode = true
# 夜间模式开始小时（0-23）默认：21
dark_start = 21
# 夜间模式结束小时（0-23）默认：7，支持跨天区间
dark_end = 7

# ═══════════════════════════════════════════════════════════════════════
#  限频
# ═══════════════════════════════════════════════════════════════════════

[rate_limit]
# 每人每次记录之间的冷却时间（分钟）默认：1440（24小时）
cooldown_minutes = 24
# 冷却期内打卡时的自动回复
exceed_reply = "注意身体，歇会儿吧！"

# ═══════════════════════════════════════════════════════════════════════
#  数据保留
# ═══════════════════════════════════════════════════════════════════════

[retention]
# 数据保留月数（超过后自动清理旧文件）默认：2
months = 2
# 插件加载时自动清理过期数据
auto_cleanup = true

# ═══════════════════════════════════════════════════════════════════════
#  群过滤（白名单模式）
# ═══════════════════════════════════════════════════════════════════════

[group_filter]
# 白名单群号列表，每行一个群号。留空 = 允许所有群
allowed_groups = []
